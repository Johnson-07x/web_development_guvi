<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2>Your Profile</h2>

<p><strong>Username:</strong> <span id="username"></span></p>

<input class="form-control mt-3" id="age" placeholder="Age">
<input class="form-control mt-3" id="dob" type="date">
<input class="form-control mt-3" id="contact" placeholder="Contact">

<button class="btn btn-warning mt-3" onclick="updateProfile()">Update</button>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
